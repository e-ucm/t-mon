name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The lint script is `compileall`: the app ships as plain Python, and a module
      # with a syntax error is a broken release the same way a type error is for the API.
      - name: Lint (compile check)
        run: python -m compileall -q .

      - name: Test
        run: python -m pytest -v

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the image so a broken Dockerfile fails the pipeline, without pushing
      # anywhere. Publishing happens on tags (see docker-publish.yml).
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: t-mon:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
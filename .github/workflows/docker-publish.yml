name: Docker

# A tag is the release. The tag must name the version in __init__.py: a container
# whose tag disagrees with the code inside it is worse than no container at all.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  services:
    name: Build and health-check t-mon
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image and check health
        run: bash .github/scripts/ci-services.sh .

  verify:
    name: Verify tag and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The dashboard reads client_secrets.json at import time and the real file is
      # gitignored, so the example stands in for it while the tests run.
      - name: Provide client secrets for tests
        run: cp client_secrets_example.json client_secrets.json

      - name: Check the tag names the version
        run: |
          set -euo pipefail
          VERSION=$(awk -F'"' '/^__version__/{print $2; exit}' __init__.py)
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match __version__ v$VERSION"
            exit 1
          fi
          echo "releasing t-mon $VERSION"

      - name: Lint (compile check)
        run: python -m compileall -q .

      - name: Test
        run: python -m pytest -v

  publish:
    name: Build and push image
    needs: services
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max